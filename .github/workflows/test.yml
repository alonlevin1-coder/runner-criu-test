name: Checkpoint & MicroVM Restore Test
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  criu-test:
    runs-on: self-hosted
    steps:
      - name: Step 1 Pre-migration on Host
        run: |
          echo "=== STEP 1: Running on Host ==="
          echo "Host Hostname: $(hostname)"
          echo "Host PID 1: $(cat /proc/1/cmdline 2>/dev/null | tr '\0' ' ')"
          echo "Executing work on host..."
          sleep 1
          echo "Step 1 completed successfully."

      - name: Step 2 Checkpoint & Migration Trigger
        run: |
          echo "=== STEP 2: Preparing Checkpoint ==="
          mkdir -p /home/m/runner_idea/scratch/t8b_real_runner/output
          echo "READY" > /home/m/runner_idea/scratch/t8b_real_runner/output/step2_ready
          echo "Step 2 signaled helper. Waiting for migration into VM..."
          
          INITIAL_HOST=$(hostname)
          INITIAL_BOOT=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo "none")
          
          while true; do
            CUR_HOST=$(hostname)
            CUR_BOOT=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo "none")
            if [ "$CUR_HOST" != "$INITIAL_HOST" ]; then
              echo "Detected hostname change: $INITIAL_HOST -> $CUR_HOST"
              break
            fi
            if [ "$CUR_BOOT" != "$INITIAL_BOOT" ]; then
              echo "Detected boot ID change: $INITIAL_BOOT -> $CUR_BOOT"
              break
            fi
            if [ -f /tmp/migration_restored ] || [ -f /home/m/runner_idea/scratch/t8b_real_runner/output/migration_restored ]; then
              echo "Detected migration restored marker!"
              break
            fi
            sleep 0.2
          done
          
          echo "=== STEP 2: Successfully migrated into VM! Exiting step. ==="

      - name: Step 3 Hello World from VM
        run: |
          echo "=== STEP 3: Hello World from Real Runner in VM! ==="
          echo "VM Hostname: $(hostname)"
          echo "VM PID 1: $(cat /proc/1/cmdline 2>/dev/null | tr '\0' ' ')"
          echo "VM Kernel: $(uname -r)"
          
          cat <<EOF > /home/m/runner_idea/scratch/t8b_real_runner/output/step3_verification.txt
=== REAL RUNNER STEP 3 VERIFICATION ===
VERDICT: SUCCESS
Message: hello world from real GitHub Actions runner in VM!
Hostname: $(hostname)
PID 1: $(cat /proc/1/cmdline 2>/dev/null | tr '\0' ' ')
Kernel: $(uname -r)
Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
=======================================
EOF
          echo "Verification file written. CI Job in VM complete!"
