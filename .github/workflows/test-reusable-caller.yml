name: Test Reusable MicroVM Workflow

on:
  push:
  workflow_dispatch:

jobs:
  test-microvm-multistep:
    name: MicroVM Multi-Step Execution
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve MicroVM Action
        shell: bash
        run: |
          mkdir -p .github/actions/microvm
          cp -a action.yml scripts appliance bin .github/actions/microvm/ 2>/dev/null || true

      - name: Migrate Runner to MicroVM
        uses: ./.github/actions/microvm
        with:
          tcp-mode: established
          memory-mb: '4096'
          smp: '2'
          kernel: host

      - name: Step 1 inside MicroVM (Initial Workload)
        run: |
          echo "=== Step 1 inside MicroVM ==="
          echo "Kernel: $(uname -r)"
          HOST_KVER=""
          for p in /mnt/checkpoint/host_uname_r.txt /run/runner_checkpoint/host_uname_r.txt; do
            [ -f "${p}" ] && HOST_KVER="$(cat "${p}")" && break
          done
          if [ -n "${HOST_KVER}" ]; then
            if [ "$(uname -r)" != "${HOST_KVER}" ]; then
              echo "FAIL: guest kernel $(uname -r) != host ${HOST_KVER}"
              exit 1
            fi
            echo "CONFIRMED: guest kernel matches host ${HOST_KVER}"
          fi
          echo "Hostname: $(hostname)"
          PID1="$(cat /proc/1/comm 2>/dev/null || ps -p 1 -o comm= 2>/dev/null || echo unknown)"
          echo "PID 1 is: ${PID1}"
          BOOT_ID="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unknown)"
          echo "Boot ID: ${BOOT_ID}"
          UPTIME="$(cat /proc/uptime 2>/dev/null || echo unknown)"
          echo "Uptime: ${UPTIME}"
          if [ ! -f /run/is_vm ] && [ ! -f /tmp/is_vm ] && [ ! -f /etc/is_vm ]; then
            echo "FAIL: Expected is_vm marker inside MicroVM!"
            exit 1
          fi
          touch /tmp/is_vm 2>/dev/null || true
          echo "${BOOT_ID}" > /tmp/vm_step1_boot_id.txt
          echo "${UPTIME}" > /tmp/vm_step1_uptime.txt
          echo "step1_completed" > /tmp/vm_step1_marker.txt
          
          echo "--- Checking /usr overlay and private /etc ---"
          if ! mount | grep -E "on /usr type overlay"; then
            echo "FAIL: /usr is not mounted as overlay!"
            mount
            exit 1
          fi
          echo "CONFIRMED: /usr is mounted as overlay"

          if mount | grep -E "on /etc type (overlay|9p)"; then
            echo "FAIL: /etc must be a guest-private copy, not a live host share!"
            mount | grep " /etc "
            exit 1
          fi
          echo "CONFIRMED: /etc is not a host 9p/overlay share"

          if mount | grep -E "on /var type (overlay|9p)"; then
            echo "FAIL: /var must be a guest-private copy, not a live host share!"
            mount | grep " /var "
            exit 1
          fi
          if [ ! -s /var/lib/dpkg/status ]; then
            echo "FAIL: /var/lib/dpkg/status missing; apt/dpkg state was not copied"
            ls -la /var/lib 2>/dev/null || true
            exit 1
          fi
          echo "CONFIRMED: guest /var has dpkg status ($(wc -l < /var/lib/dpkg/status) lines)"

          echo "--- Guest apt-get install (hello) ---"
          export DEBIAN_FRONTEND=noninteractive
          if dpkg -s hello >/dev/null 2>&1; then
            echo "hello already installed; reinstalling to prove dpkg writes"
            sudo apt-get install -y --no-install-recommends --reinstall hello
          else
            sudo apt-get install -y --no-install-recommends hello
          fi
          hello
          command -v hello
          echo "hello" > /tmp/vm_step1_apt_ok.txt
          echo "CONFIRMED: apt-get install hello succeeded in guest"

          echo "--- Guest systemd can start a unit (no host /var/lib/systemd) ---"
          sudo systemctl reset-failed t9-daemon-test.service 2>/dev/null || true
          sudo systemctl stop t9-daemon-test.service 2>/dev/null || true
          if ! sudo systemd-run --unit=t9-daemon-test --remain-after-exit /bin/true; then
            echo "FAIL: systemd-run could not start t9-daemon-test"
            systemctl status t9-daemon-test.service --no-pager || true
            exit 1
          fi
          if ! systemctl is-active --quiet t9-daemon-test.service; then
            echo "FAIL: t9-daemon-test is not active"
            systemctl status t9-daemon-test.service --no-pager || true
            exit 1
          fi
          echo "t9-daemon-test" > /tmp/vm_step1_daemon_ok.txt
          echo "CONFIRMED: systemd started t9-daemon-test (active)"

          echo "--- Guest snap state (COPY if under 512MiB cap) ---"
          if [ ! -d /var/lib/snapd ]; then
            echo "FAIL: /var/lib/snapd missing; GH runner snapd should be under the COPY cap"
            ls -la /var/lib 2>/dev/null || true
            exit 1
          fi
          echo "CONFIRMED: /var/lib/snapd present ($(du -sh /var/lib/snapd 2>/dev/null | awk '{print $1}'))"
          if ! sudo systemctl start snapd.socket snapd.service; then
            echo "FAIL: could not start snapd"
            systemctl status snapd.service --no-pager || true
            exit 1
          fi
          if ! systemctl is-active --quiet snapd.socket && ! systemctl is-active --quiet snapd.service; then
            echo "FAIL: snapd socket/service not active"
            systemctl status snapd.socket snapd.service --no-pager || true
            exit 1
          fi
          snap version || true
          echo "CONFIRMED: snapd is running"

          echo "--- Guest dockerd (isolated engine, not host socket) ---"
          if ! systemctl is-active --quiet docker.service && ! systemctl is-active --quiet docker.socket; then
            echo "FAIL: guest docker.service/socket not active"
            systemctl status docker.service docker.socket containerd.service --no-pager || true
            journalctl -u docker -u docker.socket -u containerd -n 80 --no-pager || true
            exit 1
          fi
          if [ ! -S /var/run/docker.sock ] && [ ! -S /run/docker.sock ]; then
            echo "FAIL: guest docker.sock missing"
            ls -la /run /var/run 2>/dev/null || true
            exit 1
          fi
          if ! docker info; then
            echo "FAIL: docker info against guest dockerd"
            systemctl status docker.service --no-pager || true
            exit 1
          fi
          IMG_COUNT="$(docker info --format '{{.Images}}' 2>/dev/null || echo missing)"
          echo "guest docker images=${IMG_COUNT}"
          if [ "${IMG_COUNT}" != "0" ] && [ "${IMG_COUNT}" != "missing" ]; then
            echo "FAIL: guest dockerd should start empty (host image store is DROP); images=${IMG_COUNT}"
            docker images || true
            exit 1
          fi
          echo "CONFIRMED: guest dockerd is running with its own empty store"

          echo "--- Host systemd wants imported; denylist stays down ---"
          ls -la /etc/systemd/system/multi-user.target.wants 2>/dev/null || true
          ls -la /etc/systemd/system/sockets.target.wants 2>/dev/null || true
          for u in ssh.service walinuxagent.service systemd-networkd.service NetworkManager.service; do
            if systemctl is-active --quiet "${u}" 2>/dev/null; then
              echo "FAIL: denylist unit ${u} is active in guest"
              systemctl status "${u}" --no-pager || true
              exit 1
            fi
          done
          echo "CONFIRMED: denylist units are not active"

          echo "--- Checking guest identity in /etc ---"
          echo "Guest Machine ID: $(cat /etc/machine-id)"
          if [ -z "$(cat /etc/machine-id 2>/dev/null)" ]; then
            echo "FAIL: /etc/machine-id is empty!"
            exit 1
          fi
          if ! grep -q "MicroVM guest filesystem table" /etc/fstab; then
            echo "FAIL: /etc/fstab is not the guest stub!"
            cat /etc/fstab
            exit 1
          fi
          echo "CONFIRMED: /etc/fstab is guest stub"

          echo "Writing test file into /usr/local/bin/..."
          sudo sh -c 'echo "step1_usr_overlay_verified" > /usr/local/bin/vm_usr_overlay_test.txt'
          echo "Writing test file into /etc/..."
          sudo sh -c 'echo "step1_etc_overlay_verified" > /etc/vm_etc_overlay_test.txt'

          echo "PASS: Confirmed execution inside MicroVM Step 1!"

      - name: Step 2 inside MicroVM (Multi-Step Continuation Test)
        run: |
          echo "=== Step 2 inside MicroVM ==="
          echo "Kernel: $(uname -r)"
          echo "Hostname: $(hostname)"
          PID1="$(cat /proc/1/comm 2>/dev/null || ps -p 1 -o comm= 2>/dev/null || echo unknown)"
          echo "PID 1 is: ${PID1}"
          BOOT_ID_STEP2="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unknown)"
          echo "Boot ID: ${BOOT_ID_STEP2}"
          UPTIME_STEP2="$(cat /proc/uptime 2>/dev/null || echo unknown)"
          echo "Uptime: ${UPTIME_STEP2}"
          
          if [ ! -f /run/is_vm ] && [ ! -f /tmp/is_vm ] && [ ! -f /etc/is_vm ]; then
            echo "FAIL: Expected is_vm marker inside MicroVM in Step 2!"
            exit 1
          fi
          
          if [ ! -f /tmp/vm_step1_marker.txt ]; then
            echo "FAIL: Step 1 marker /tmp/vm_step1_marker.txt not found in Step 2 (not same persistent environment)!"
            exit 1
          fi
          
          BOOT_ID_STEP1="$(cat /tmp/vm_step1_boot_id.txt 2>/dev/null || echo missing)"
          if [ "${BOOT_ID_STEP1}" != "${BOOT_ID_STEP2}" ]; then
            echo "FAIL: Boot ID mismatch between Step 1 (${BOOT_ID_STEP1}) and Step 2 (${BOOT_ID_STEP2})!"
            exit 1
          fi

          echo "--- Verifying /usr overlay and private /etc persistence ---"
          if [ ! -f /usr/local/bin/vm_usr_overlay_test.txt ]; then
            echo "FAIL: /usr/local/bin/vm_usr_overlay_test.txt not found in Step 2!"
            exit 1
          fi
          echo "CONFIRMED: /usr overlay write persisted across steps: $(cat /usr/local/bin/vm_usr_overlay_test.txt)"

          if [ ! -f /etc/vm_etc_overlay_test.txt ]; then
            echo "FAIL: /etc/vm_etc_overlay_test.txt not found in Step 2!"
            exit 1
          fi
          echo "CONFIRMED: guest /etc write persisted across steps: $(cat /etc/vm_etc_overlay_test.txt)"

          if [ ! -f /tmp/vm_step1_apt_ok.txt ]; then
            echo "FAIL: apt install marker missing in Step 2"
            exit 1
          fi
          hello
          echo "CONFIRMED: hello binary still works in Step 2"

          if [ ! -f /tmp/vm_step1_daemon_ok.txt ]; then
            echo "FAIL: daemon start marker missing in Step 2"
            exit 1
          fi
          if ! systemctl is-active --quiet t9-daemon-test.service; then
            echo "FAIL: t9-daemon-test did not persist into Step 2"
            systemctl status t9-daemon-test.service --no-pager || true
            exit 1
          fi
          echo "CONFIRMED: t9-daemon-test still active in Step 2"

          if ! docker info >/dev/null; then
            echo "FAIL: guest docker info did not persist into Step 2"
            exit 1
          fi
          echo "CONFIRMED: guest docker info still works in Step 2"

          echo "CONFIRMED: Identical guest kernel Boot ID across Step 1 and Step 2: ${BOOT_ID_STEP2}"
          echo "CONFIRMED: Step 1 marker persisted in guest /tmp: $(cat /tmp/vm_step1_marker.txt)"
          echo "PASS: Confirmed Step 2 executed inside the SAME persistent MicroVM instance under systemd PID 1!"

      - name: Step 3 inside MicroVM (Live Log Streaming Test)
        run: |
          echo "=== Step 3: Live Log Streaming Test ==="
          echo "Guest Hostname: $(hostname)"
          echo "PID 1 is: $(cat /proc/1/comm 2>/dev/null || ps -p 1 -o comm= 2>/dev/null || echo unknown)"
          echo "Step 3 start time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Waiting 10 seconds before streaming..."
          sleep 10
          echo "Starting 10-message live log stream at $(date -u +%Y-%m-%dT%H:%M:%SZ):"
          for i in $(seq 1 10); do
            echo "[$(date -u +%T)] Live log stream message ${i}/10 from MicroVM ($(hostname))"
            sleep 1
          done
          echo "Step 3 end time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "PASS: Successfully streamed 10 messages from inside MicroVM in Step 3!"

