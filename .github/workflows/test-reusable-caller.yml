name: Test Reusable MicroVM Workflow

on:
  push:
  workflow_dispatch:

jobs:
  call-reusable-vm:
    name: Call Reusable MicroVM
    uses: ./.github/workflows/reusable-microvm.yml
    with:
      tcp-mode: established
      memory-mb: '4096'
      smp: '2'
      run: |
        echo "=== Running inside MicroVM via Reusable Workflow ==="
        echo "Kernel: $(uname -r)"
        echo "Hostname: $(hostname)"
        echo "PID 1 is: $(cat /proc/1/comm 2>/dev/null || ps -p 1 -o comm= 2>/dev/null || echo unknown)"
        if [ ! -f /tmp/is_vm ]; then
          echo "FAIL: Expected /tmp/is_vm inside MicroVM!"
          exit 1
        fi
        echo "PASS: Confirmed execution inside MicroVM via Reusable Workflow!"
