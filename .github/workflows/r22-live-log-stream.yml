name: R22 live log stream smoke

on:
  workflow_dispatch:
    inputs:
      sleep_sec:
        description: Seconds to sleep before echo (try 10000 to watch live UI)
        required: false
        default: "30"
  push:
    branches: [debug/qemu-smoke, main]
    paths:
      - '.github/workflows/r22-live-log-stream.yml'
      - 'scripts/vm_run.sh'
      - 'scripts/vm_teardown.sh'
      - 'scripts/smoke_is_vm_helper.sh'
      - 'scripts/is_vm_wait.sh'

permissions:
  contents: read

jobs:
  r22-live-log:
    name: R22 live VM log streaming
    timeout-minutes: 180
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build CRIU, initramfs, daemonize
        run: |
          mkdir -p smoke-logs checkpoint
          chmod +x scripts/build_criu.sh appliance/assemble_initramfs.sh
          ./scripts/build_criu.sh
          sudo apt-get install -y qemu-system-x86 cpio gcc dropbear-bin openssh-client
          ./appliance/assemble_initramfs.sh
          gcc -O2 -Wall scripts/daemonize.c -o scripts/daemonize
          chmod +x scripts/smoke_is_vm_helper.sh scripts/is_vm_wait.sh
          chmod +x scripts/vm_run.sh scripts/vm_teardown.sh

      - name: Checkpoint & Migrate to VM
        env:
          ALLOW_WORKER_DUMP: "1"
          KEEP_QEMU_ALIVE: "1"
        run: |
          if [ -f /tmp/is_vm ]; then
            echo "already in VM"
            exit 0
          fi

          rm -rf checkpoint && mkdir -p checkpoint smoke-logs
          export RUNNER_VM_CHECKPOINT="${GITHUB_WORKSPACE}/checkpoint"

          WORKER_PID=$(pgrep -f 'Runner\.Worker' | head -n1 || true)
          echo "WORKER_PID=${WORKER_PID}" | tee smoke-logs/r22-worker.txt
          [ -n "${WORKER_PID}" ] || exit 1

          sudo -E ./scripts/daemonize \
            "$(pwd)/scripts/smoke_is_vm_helper.sh" \
            "${WORKER_PID}" \
            "$(pwd)/checkpoint" \
            "$(pwd)" \
            "$(pwd)/smoke-logs/vm_serial.log" \
            "worker"

          export IS_VM_MAX_WAIT_SEC=420
          export IS_VM_WAIT_LEGACY=1
          ./scripts/is_vm_wait.sh

          for i in $(seq 1 120); do
            if [ -f checkpoint/helper_done ] || [ -f checkpoint/helper_failed ]; then
              echo "helper finished at ${i}s"
              break
            fi
            sleep 1
          done

          [ "$(cat checkpoint/restore.rc 2>/dev/null)" = "0" ] || exit 1
          grep -qE 'tag=vm_(entry|loop)' checkpoint/vm_done
          grep -q 'qemu_keep_alive=yes' checkpoint/state.txt

      - name: Sleep then echo in VM
        env:
          SLEEP_SEC: ${{ inputs.sleep_sec || '30' }}
        run: |
          ./scripts/vm_run.sh "sleep ${SLEEP_SEC}; echo lalalal"

      - name: Teardown VM
        if: always()
        run: ./scripts/vm_teardown.sh

      - name: Verify R22
        run: |
          grep -q 'qemu_teardown=yes' checkpoint/state.txt
          echo "PASS: independent step ran in VM with live SSH streaming"

      - name: Upload R22 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r22-live-log
          path: smoke-logs/ checkpoint/
          if-no-files-found: ignore
