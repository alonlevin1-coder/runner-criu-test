name: Test proxy binaries from GitHub Release

# Download proxy_core / t9-ca-inject from the feature repo (runner_idea),
# not from a vendored tree in this deployment repo.
on:
  workflow_dispatch:
    inputs:
      proxy-release:
        description: 'Tag in alonlevin1-coder/runner_idea'
        required: false
        default: 'proxy-v0.1.0'
        type: string

permissions:
  contents: read

jobs:
  migrate-from-feature-release:
    name: Migrate using runner_idea release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Require FEATURES_READ_TOKEN
        env:
          TOKEN: ${{ secrets.FEATURES_READ_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "ERROR: set repo secret FEATURES_READ_TOKEN (PAT with contents:read on alonlevin1-coder/runner_idea)"
            exit 1
          fi

      - name: Move vendored proxy aside so auto cannot local-build
        run: |
          if [ -d visibility/proxy_implementation ]; then
            mv visibility/proxy_implementation /tmp/proxy_implementation.off
          fi

      - name: Migrate Runner to MicroVM (component-source=release)
        uses: ./
        with:
          tcp-mode: established
          memory-mb: '4096'
          smp: '2'
          component-source: release
          components-repo: alonlevin1-coder/runner_idea
          proxy-release: ${{ inputs.proxy-release }}
          components-token: ${{ secrets.FEATURES_READ_TOKEN }}

      - name: Confirm MicroVM
        run: |
          [ -f /tmp/is_vm ] || { echo "FAIL: not in microVM"; exit 1; }
          echo "Kernel: $(uname -r)"
          curl -sSf -I https://api.github.com | head -n 5
          echo "PASS: feature-repo release + deploy-repo migrate"
