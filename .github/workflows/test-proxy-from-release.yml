name: Test proxy binaries from GitHub Release

# After Comprehensive baseline: prove the action can boot from a release
# asset instead of go-building a vendored tree. Same private repo is enough.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ci-proxy:
    name: Publish ephemeral proxy release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate proxy_implementation
        id: src
        run: |
          if [ -f proxy_implementation/go.mod ]; then
            echo "dir=proxy_implementation" >> "${GITHUB_OUTPUT}"
          elif [ -f visibility/proxy_implementation/go.mod ]; then
            echo "dir=visibility/proxy_implementation" >> "${GITHUB_OUTPUT}"
          else
            echo "ERROR: no proxy_implementation in this checkout (need a feature repo or vendored tree to mint a first release)"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.src.outputs.dir }}/go.mod

      - name: Build
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOTOOLCHAIN: auto
        run: |
          go build -trimpath -ldflags='-s -w' -o "${GITHUB_WORKSPACE}/proxy_core" ./4_proxy_core/
          go build -trimpath -ldflags='-s -w' -o "${GITHUB_WORKSPACE}/t9-ca-inject" ./cmd/t9-ca-inject/
          sha256sum proxy_core t9-ca-inject > SHA256SUMS

      - name: Create prerelease
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-proxy-${GITHUB_RUN_ID}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          gh release create "${TAG}" proxy_core t9-ca-inject SHA256SUMS \
            --prerelease --title "${TAG}" \
            --notes "Ephemeral CI asset for test-proxy-from-release. Safe to delete."

  migrate-from-release:
    name: Migrate using release binaries
    needs: [publish-ci-proxy]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Move vendored proxy aside so auto cannot local-build
        run: |
          if [ -d visibility/proxy_implementation ]; then
            mv visibility/proxy_implementation /tmp/proxy_implementation.off
          fi

      - name: Migrate Runner to MicroVM (component-source=release)
        uses: ./
        with:
          tcp-mode: established
          memory-mb: '4096'
          smp: '2'
          component-source: release
          components-repo: ${{ github.repository }}
          proxy-release: ${{ needs.publish-ci-proxy.outputs.tag }}

      - name: Confirm MicroVM
        run: |
          [ -f /tmp/is_vm ] || { echo "FAIL: not in microVM"; exit 1; }
          echo "Kernel: $(uname -r)"
          curl -sSf -I https://api.github.com | head -n 5
          echo "PASS: release-sourced proxy + migrate"

  cleanup-prerelease:
    name: Delete ephemeral release
    needs: [publish-ci-proxy, migrate-from-release]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: gh release delete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish-ci-proxy.outputs.tag }}
        run: |
          [ -n "${TAG}" ] || exit 0
          gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
