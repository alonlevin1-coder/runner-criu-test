name: CRIU MicroVM Migration Test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: write-all

jobs:
  criu-vm-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        run: |
          echo "=== Cloning repository (ref=${{ github.ref_name }} sha=${{ github.sha }}) ==="
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Install Dependencies
        run: |
          echo "=== Installing Dependencies ==="
          # Runner.Listener already maps libc/libssl; replacing them makes CRIU dump ghost files.
          sudo apt-mark hold libc6 libc6-dev libssl3 libssl-dev 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-upgrade qemu-system-x86 gdb dropbear-bin openssh-client cpio gcc
          sudo chmod 666 /dev/kvm
          echo "--- QEMU Version ---"
          qemu-system-x86_64 --version

      - name: Build CRIU from Source
        run: |
          echo "=== Building CRIU from source (AMX/XSAVE sized buffer) ==="
          chmod +x scripts/build_criu.sh
          ./scripts/build_criu.sh
          echo "--- CRIU Kernel Compatibility Check ---"
          sudo criu check || true
          echo "--- Host XSAVE / CPU features ---"
          grep -m1 '^model name' /proc/cpuinfo || true
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(xsave|osxsave|avx|avx2|avx512|amx|xsavec|xsaveopt|xsaves)' || true
          /tmp/xsave_size || true

      - name: Diagnose Runner.Listener
        run: |
          echo "=== Runner.Listener & Environment Diagnostics ==="
          mkdir -p diagnostics
          
          LISTENER_PID=$(pgrep -f "Runner.Listener" | head -n 1 || echo "")
          WORKER_PID=$(pgrep -f "Runner.Worker" | head -n 1 || echo "")
          
          echo "LISTENER_PID=${LISTENER_PID}" | tee diagnostics/listener_pid.txt
          echo "WORKER_PID=${WORKER_PID}" | tee diagnostics/worker_pid.txt
          
          echo "--- Host Information ---" | tee diagnostics/host_info.txt
          hostname | tee -a diagnostics/host_info.txt
          uname -r | tee -a diagnostics/host_info.txt
          cat /proc/version | tee -a diagnostics/host_info.txt
          
          echo "--- Process Tree ---" | tee diagnostics/pstree.txt
          ps aux | tee -a diagnostics/pstree.txt
          
          if [ -n "${LISTENER_PID}" ]; then
            echo "--- Runner.Listener (PID ${LISTENER_PID}) FDs ---" | tee diagnostics/listener_fds.txt
            sudo ls -la /proc/${LISTENER_PID}/fd/ | tee -a diagnostics/listener_fds.txt
            
            echo "--- Runner.Listener Memory Maps (First 100 lines) ---"
            head -n 100 /proc/${LISTENER_PID}/maps > diagnostics/listener_maps_head.txt
          else
            echo "WARNING: Runner.Listener process not found!"
          fi
          
          if [ -n "${WORKER_PID}" ]; then
            echo "--- Runner.Worker (PID ${WORKER_PID}) FDs ---" | tee diagnostics/worker_fds.txt
            sudo ls -la /proc/${WORKER_PID}/fd/ | tee -a diagnostics/worker_fds.txt
          fi
          
          echo "--- .NET Diagnostic Sockets ---" | tee diagnostics/dotnet_sockets.txt
          sudo ls -la /tmp/dotnet-diagnostic-* 2>/dev/null | tee -a diagnostics/dotnet_sockets.txt || echo "None found."

      - name: Upload Runner Diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnostics
          path: diagnostics/

      - name: Assemble VM Initramfs
        run: |
          echo "=== Assembling VM Initramfs ==="
          chmod +x appliance/assemble_initramfs.sh scripts/*.sh
          ./appliance/assemble_initramfs.sh
          gcc -O2 -Wall scripts/daemonize.c -o scripts/daemonize
          ls -lh appliance/initramfs.cpio.gz

      - name: Checkpoint & Migrate to VM
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ALLOW_WORKER_DUMP: "1"
        run: |
          echo "=== Checkpoint & Migrate to VM (Worker leave-running) ==="
          if [ -f /tmp/is_vm ]; then
            echo "already in VM — migration skipped"
            exit 0
          fi

          rm -rf checkpoint && mkdir -p checkpoint
          chmod +x scripts/smoke_is_vm_helper.sh scripts/is_vm_wait.sh scripts/post_migration_hello.sh

          WORKER_PID=$(pgrep -f 'Runner\.Worker' | head -n1 || true)
          echo "WORKER_PID=${WORKER_PID}"
          [ -n "${WORKER_PID}" ] || exit 1

          sudo -E ./scripts/daemonize \
            "$(pwd)/scripts/smoke_is_vm_helper.sh" \
            "${WORKER_PID}" \
            "$(pwd)/checkpoint" \
            "$(pwd)" \
            "$(pwd)/vm_serial.log" \
            "worker"

          export RUNNER_VM_CHECKPOINT="${GITHUB_WORKSPACE}/checkpoint"
          export IS_VM_MAX_WAIT_SEC=300
          export IS_VM_WAIT_LEGACY=1
          export POST_MIGRATION_SCRIPT="${GITHUB_WORKSPACE}/scripts/post_migration_hello.sh"

          set +e
          ./scripts/is_vm_wait.sh
          WAIT_RC=$?
          set -e
          [ "${WAIT_RC}" -eq 0 ] || exit "${WAIT_RC}"

          for i in $(seq 1 90); do
            if [ -f checkpoint/helper_done ] || [ -f checkpoint/helper_failed ]; then
              echo "helper finished at ${i}s"
              break
            fi
            sleep 1
          done
          sudo chmod -R a+rX checkpoint vm_serial.log 2>/dev/null || true
          [ "$(cat checkpoint/restore.rc 2>/dev/null)" = "0" ] || exit 1
          grep -qE 'tag=vm_(entry|loop)' checkpoint/vm_done
          [ -f checkpoint/vm_step3_done ] || { echo "post-migration did not run in VM"; exit 1; }

      - name: Hello World
        run: |
          if [ -f /tmp/is_vm ]; then
            ./scripts/post_migration_hello.sh
            exit 0
          fi
          if [ -f checkpoint/vm_step3_done ]; then
            cat checkpoint/vm_step3_output.txt
            cp checkpoint/vm_step3_output.txt checkpoint/step3_verification.txt 2>/dev/null || true
            exit 0
          fi
          echo "ERROR: post-migration step did not run in VM"
          exit 1
