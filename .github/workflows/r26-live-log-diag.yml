name: R26 live log diag

on:
  workflow_dispatch:
    inputs:
      sleep_sec:
        description: Seconds to sleep after lalala (diag snapshots every 10s)
        required: false
        default: "120"


permissions:
  contents: read

jobs:
  r26-live-diag:
    name: R26 VM live log _diag investigation
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
      RUNNER_DEBUG: 1
    steps:
      - uses: actions/checkout@v4

      - name: Build CRIU, initramfs, daemonize
        run: |
          mkdir -p smoke-logs checkpoint output
          chmod +x scripts/build_criu.sh appliance/assemble_initramfs.sh
          ./scripts/build_criu.sh
          sudo apt-get install -y qemu-system-x86 cpio gcc dropbear-bin openssh-client
          ./appliance/assemble_initramfs.sh
          gcc -O2 -Wall scripts/daemonize.c -o scripts/daemonize
          chmod +x scripts/smoke_is_vm_helper.sh scripts/is_vm_wait.sh
          chmod +x scripts/collect_runner_diag.sh scripts/r26_live_diag_step.sh scripts/summarize_r26_diag.sh

      - name: Step 1 — host marker
        run: |
          echo "=== STEP 1: host ==="
          echo "Hostname: $(hostname)"
          echo "step1_host_ok" > checkpoint/step1_host.txt

      - name: Checkpoint & Migrate to VM
        continue-on-error: true
        env:
          ALLOW_WORKER_DUMP: "1"
          KEEP_QEMU_ALIVE: "1"
          CRIU_TCP_MODE: close
        run: |
          if [ -f /tmp/is_vm ]; then
            export RUNNER_VM_CHECKPOINT="${GITHUB_WORKSPACE}/checkpoint"
            ./scripts/is_vm_wait.sh
            exit 0
          fi
          mkdir -p checkpoint smoke-logs output
          WORKER_PID=$(pgrep -f 'Runner\.Worker' | head -n1 || true)
          [ -n "${WORKER_PID}" ] || exit 1
          sudo -E ./scripts/daemonize \
            "$(pwd)/scripts/smoke_is_vm_helper.sh" \
            "${WORKER_PID}" "$(pwd)/checkpoint" "$(pwd)" \
            "$(pwd)/smoke-logs/vm_serial.log" "worker"
          export RUNNER_VM_CHECKPOINT="${GITHUB_WORKSPACE}/checkpoint"
          export IS_VM_MAX_WAIT_SEC=600
          ./scripts/is_vm_wait.sh >> smoke-logs/host-wait.log 2>&1

      - name: Sleep lalala + collect _diag (native StepsRunner)
        env:
          SLEEP_SEC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sleep_sec || '120' }}
          DIAG_INTERVAL_SEC: "10"
          RUNNER_VM_CHECKPOINT: ${{ github.workspace }}/checkpoint
        run: ./scripts/r26_live_diag_step.sh

      - name: Summarize R26 _diag
        if: always()
        env:
          RUNNER_VM_CHECKPOINT: ${{ github.workspace }}/checkpoint
        run: ./scripts/summarize_r26_diag.sh

      - name: Upload R26 diag artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r26-live-log-diag
          path: |
            smoke-logs/
            checkpoint/
          if-no-files-found: ignore
