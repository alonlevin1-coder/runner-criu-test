name: Reusable MicroVM Job

on:
  workflow_call:
    inputs:
      run:
        description: 'Commands or script to execute inside the microVM'
        required: true
        type: string
      tcp-mode:
        description: 'CRIU TCP mode (established or close)'
        required: false
        type: string
        default: 'established'
      memory-mb:
        description: 'RAM in MB for microVM'
        required: false
        type: string
      smp:
        description: 'vCPUs for microVM'
        required: false
        type: string
        default: '2'
      runs-on:
        description: 'Runner OS image'
        required: false
        type: string
        default: 'ubuntu-24.04'

jobs:

  microvm-runner:
    runs-on: ${{ inputs.runs-on || 'ubuntu-24.04' }}
    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@v4

      - name: Resolve MicroVM Action
        shell: bash
        run: |
          if [ -f action.yml ] && [ -f scripts/setup_microvm_action.sh ]; then
            echo "Using repository local action for MicroVM migration"
            mkdir -p .github/actions/microvm
            cp -a action.yml scripts appliance bin .github/actions/microvm/ 2>/dev/null || true
          fi

      - name: Checkout MicroVM Action (for external callers)
        if: ${{ !hashFiles('.github/actions/microvm/action.yml') }}
        uses: actions/checkout@v4
        with:
          repository: alonlevin1-coder/runner-criu-test
          ref: port/is-vm-worker-migration
          path: .github/actions/microvm

      - name: Migrate to MicroVM
        uses: ./.github/actions/microvm
        with:
          tcp-mode: ${{ inputs.tcp-mode }}
          memory-mb: ${{ inputs.memory-mb }}
          smp: ${{ inputs.smp }}

      - name: Execute User Workload in MicroVM
        shell: bash
        run: ${{ inputs.run }}

