name: Test Reusable Workflows, 3rd Party Actions & Artifacts

on:
  workflow_dispatch:

jobs:
  produce-via-reusable:
    name: Call Reusable MicroVM Producer
    uses: ./.github/workflows/reusable-artifact-producer.yml
    with:
      artifact-name: "golden-microvm-artifact"

  consume-on-host:
    name: Verify Artifact on Host
    needs: [produce-via-reusable]
    runs-on: ubuntu-22.04
    steps:
      - name: 3rd Party Action - Download Artifact on Host
        uses: actions/download-artifact@v4
        with:
          name: golden-microvm-artifact

      - name: Verify Artifact Integrity on Host
        run: |
          echo "=== Consumer on Host ==="
          echo "Expected SHA from Reusable Workflow: ${{ needs.produce-via-reusable.outputs.artifact-sha }}"
          ls -la
          cat microvm_artifact_payload.txt
          sha256sum -c microvm_artifact_payload.txt.sha256
          ACTUAL_SHA=$(sha256sum microvm_artifact_payload.txt | cut -d' ' -f1)
          [ "${ACTUAL_SHA}" = "${{ needs.produce-via-reusable.outputs.artifact-sha }}" ] || {
            echo "FAIL: Checksum mismatch between reusable workflow output and downloaded artifact"; exit 1;
          }
          grep -q "Kernel: 6.17" microvm_artifact_payload.txt || {
            echo "FAIL: Artifact was not produced by microVM kernel"; exit 1;
          }
          echo "PASS: Artifact produced in MicroVM verified successfully on Host!"

  consume-in-microvm:
    name: Verify Artifact & 3rd Party Actions inside MicroVM
    needs: [produce-via-reusable]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Migrate Runner to MicroVM
        uses: ./
        with:
          tcp-mode: established
          memory-mb: '4096'
          smp: '2'

      - name: Verify MicroVM Execution
        run: |
          echo "=== Consumer in MicroVM ==="
          echo "Kernel: $(uname -r)"
          echo "Hostname: $(hostname)"
          [ -f /tmp/is_vm ] || { echo "FAIL: Not in MicroVM"; exit 1; }

      - name: 3rd Party Action - GitHub Script inside MicroVM
        uses: actions/github-script@v7
        id: test-script
        with:
          script: |
            console.log('Testing GitHub Script execution inside MicroVM runner!');
            console.log('Node Version:', process.version);
            console.log('Platform:', process.platform);
            console.log('Architecture:', process.arch);
            core.setOutput('script_status', 'verified_in_vm');
            return 42;

      - name: Verify GitHub Script Output inside MicroVM
        run: |
          echo "Script status output: ${{ steps.test-script.outputs.script_status }}"
          [ "${{ steps.test-script.outputs.script_status }}" = "verified_in_vm" ] || {
            echo "FAIL: GitHub script output was not captured"; exit 1;
          }
          echo "PASS: 3rd party JavaScript action (actions/github-script) executed successfully inside MicroVM!"

      - name: 3rd Party Action - Download Artifact inside MicroVM
        uses: actions/download-artifact@v4
        with:
          name: golden-microvm-artifact

      - name: Verify Artifact Integrity inside MicroVM
        run: |
          echo "=== Verifying Artifact inside MicroVM ==="
          echo "Expected SHA: ${{ needs.produce-via-reusable.outputs.artifact-sha }}"
          ls -la microvm_artifact_payload*
          cat microvm_artifact_payload.txt
          sha256sum -c microvm_artifact_payload.txt.sha256
          ACTUAL_SHA=$(sha256sum microvm_artifact_payload.txt | cut -d' ' -f1)
          [ "${ACTUAL_SHA}" = "${{ needs.produce-via-reusable.outputs.artifact-sha }}" ] || {
            echo "FAIL: Checksum mismatch inside MicroVM"; exit 1;
          }
          grep -q "Kernel: 6.17" microvm_artifact_payload.txt || {
            echo "FAIL: Artifact not verified from microVM"; exit 1;
          }
          echo "PASS: Artifact downloaded and verified directly inside MicroVM!"
