name: R20 VM continue step smoke

on:
  workflow_dispatch:
  push:
    branches: [debug/qemu-smoke, main, port/is-vm-worker-migration]
    paths:
      - '.github/workflows/r20-vm-continue-step.yml'
      - 'scripts/is_vm_wait.sh'
      - 'scripts/post_migration_hello.sh'
      - 'scripts/smoke_is_vm_helper.sh'
      - 'scripts/freeze_snapshot_files.sh'
      - 'appliance/assemble_initramfs.sh'

permissions:
  contents: read

jobs:
  r20-vm-continue:
    name: R20 Worker migrate then next step in VM
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build CRIU, initramfs, daemonize
        run: |
          mkdir -p smoke-logs checkpoint
          chmod +x scripts/build_criu.sh appliance/assemble_initramfs.sh
          ./scripts/build_criu.sh
          sudo apt-get install -y qemu-system-x86 cpio gcc dropbear-bin openssh-client
          ./appliance/assemble_initramfs.sh
          gcc -O2 -Wall scripts/daemonize.c -o scripts/daemonize
          chmod +x scripts/smoke_is_vm_helper.sh scripts/is_vm_wait.sh scripts/post_migration_hello.sh

      - name: Migrate Worker (step 2 equivalent)
        id: migrate
        env:
          ALLOW_WORKER_DUMP: "1"
        run: |
          if [ -f /tmp/is_vm ]; then
            echo "vm_branch=true" >> "$GITHUB_OUTPUT"
            echo "already in VM — migration skipped"
            exit 0
          fi

          rm -rf checkpoint && mkdir -p checkpoint smoke-logs
          WORKER_PID=$(pgrep -f 'Runner\.Worker' | head -n1 || true)
          echo "WORKER_PID=${WORKER_PID}" | tee smoke-logs/r20-worker.txt
          [ -n "${WORKER_PID}" ] || exit 1

          sudo -E ./scripts/daemonize \
            "$(pwd)/scripts/smoke_is_vm_helper.sh" \
            "${WORKER_PID}" \
            "$(pwd)/checkpoint" \
            "$(pwd)" \
            "$(pwd)/smoke-logs/vm_serial.log" \
            "worker"

          export RUNNER_VM_CHECKPOINT="${GITHUB_WORKSPACE}/checkpoint"
          export IS_VM_MAX_WAIT_SEC=300
          export IS_VM_WAIT_LEGACY=1
          export POST_MIGRATION_SCRIPT="${GITHUB_WORKSPACE}/scripts/post_migration_hello.sh"
          set +e
          ./scripts/is_vm_wait.sh >> smoke-logs/host-wait.log 2>&1
          WAIT_RC=$?
          set -e
          echo "is_vm_wait rc=${WAIT_RC}" | tee smoke-logs/r20-wait-rc.txt
          [ "${WAIT_RC}" -eq 0 ] || exit "${WAIT_RC}"

          for i in $(seq 1 90); do
            if [ -f checkpoint/helper_done ] || [ -f checkpoint/helper_failed ]; then
              echo "helper finished at ${i}s"
              break
            fi
            sleep 1
          done
          sudo chmod -R a+rX checkpoint smoke-logs 2>/dev/null || true

      - name: Hello World
        run: |
          if [ -f /tmp/is_vm ]; then
            ./scripts/post_migration_hello.sh
            exit 0
          fi
          if [ -f checkpoint/vm_step3_done ]; then
            cat checkpoint/vm_step3_output.txt
            exit 0
          fi
          echo "FAIL: post-migration step did not run in VM"
          tail -n 40 checkpoint/post_restore_diag.txt 2>/dev/null || true
          exit 1

      - name: Verify R20
        run: |
          grep -qE 'tag=vm_(entry|loop)' checkpoint/vm_done
          [ -f checkpoint/vm_step3_done ]
          grep -q 'Hello World' checkpoint/vm_step3_output.txt
          echo "PASS: Worker migrated and post-migration step ran in VM"

      - name: Upload R20 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-vm-continue
          path: smoke-logs/ checkpoint/
          if-no-files-found: ignore
